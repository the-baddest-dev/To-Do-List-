<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, calm space to keep track of your daily tasks."
    />
    <title>Little List — Daily To-dos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <section class="todo-card" aria-labelledby="page-title">
        <header class="card-header">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="m6.5 12.5 3.4 3.4 7.8-8.1"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M20 12a8 8 0 1 1-4.1-7"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <span class="brand-name">little list</span>
        </header>

        <div class="intro">
          <p class="eyebrow">YOUR DAY, A LITTLE LIGHTER</p>
          <h1 id="page-title">Make room for<br />what matters.</h1>
          <p class="subtitle">One small step at a time. What would you like to do?</p>
        </div>

        <div class="task-entry">
          <label for="input">Add a task</label>
          <div class="entry-row">
            <input
              type="text"
              placeholder="e.g. Take a little walk"
              id="input"
              autocomplete="off"
            />
            <button type="button" onclick="save()">
              <span>Add task</span>
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path
                  d="M4.2 10h11.6m-4.7-4.7 4.7 4.7-4.7 4.7"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <section class="tasks-section" aria-labelledby="tasks-title">
          <div class="tasks-heading">
            <h2 id="tasks-title">Your list</h2>
            <span class="list-note">Keep it simple</span>
          </div>
          <div id="display" class="task-list" aria-live="polite"></div>
        </section>

        <footer class="card-footer">
          <span class="footer-dot" aria-hidden="true"></span>
          <span>Progress is progress, no matter how small.</span>
        </footer>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
